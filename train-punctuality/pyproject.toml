[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainpunct"
version = "0.1.0"
description = "Personal train punctuality forecasts for Aachen Hbf <-> Witten Hbf, built on the self-hosted Bahn-Vorhersage predictor"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "apscheduler>=3.10,<4",
    "numpy>=1.26",
]

[project.optional-dependencies]
bootstrap = ["pyarrow>=16"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyarrow>=16",
]

[project.scripts]
trainpunct = "trainpunct.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trainpunct"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
